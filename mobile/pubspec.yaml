name: offline_translator
description: A new Flutter project for Offline Translation.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  path_provider: ^2.1.1
  speech_to_text: ^7.4.0
  permission_handler: ^11.3.1
  google_mlkit_translation: ^0.14.0
  google_mlkit_text_recognition: ^0.16.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
